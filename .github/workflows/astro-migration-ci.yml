name: Astro Starlight Migration CI

on:
  push:
    branches: [astro-starlight-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: astro-migration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type and content checks
        run: npm run check

      - name: Production build
        run: npm run build
